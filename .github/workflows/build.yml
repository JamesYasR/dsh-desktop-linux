name: build-linux

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '上游 ref（分支或 tag）；留空则用 PKGBUILD 里的 _tag'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # 与上游自己的 CI 对齐（upstream/.github/workflows/ci.yml 的 PRIMARY_NODE_VERSION: '24'）。
  # 仓库 engines 是 "^22.19.0 || >=24.0.0"，所以 22.19+ 也能跑，但没理由不跟上游同一条线。
  NODE_VERSION: '24'
  # 上游 CI 设这个，避免构建期跑到的 dsh 运行时往生产遥测端点上报。这是第三方重打包仓库，
  # 更不该往上游的遥测里灌数据。
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    runs-on: ubuntu-latest
    # 整条流水线（build:official / release:pack / prepare:*）才是耗时大头，多打一种格式只多
    # 一次 fpm/AppImage 打包。所以这里一次跑完三种格式，而不是按格式拆成多个 job 各跑一遍
    # 全流水线（那是 3 倍时间）。
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # patches/ 里每个 diff 都是相对 PKGBUILD 里 _tag 那个 commit 的，所以默认 ref 必须取
      # _tag，不能取上游默认分支 master——对着 master 打补丁会直接失败。_tag 是唯一的基线
      # 事实来源，这里读它而不是再写死一遍。
      - name: 解析上游 ref
        id: upstream
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          ref="$INPUT_REF"
          if [[ -z "$ref" ]]; then
            ref="$(bash -c 'source ./PKGBUILD; printf %s "${_tag:-}"' 2>/dev/null || true)"
          fi
          if [[ -z "$ref" ]]; then
            echo "无法确定上游 ref：dispatch 输入为空，且 PKGBUILD 里读不到 _tag" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "==> 上游 ref：$ref"

      - name: 拉上游
        run: ./scripts/fetch-upstream.sh "${{ steps.upstream.outputs.ref }}"

      # 本仓库根目录没有 package.json，pnpm/action-setup 没法自己去读 packageManager，
      # 所以从上游检出里取。写死 pnpm 版本正是这次要修的 bug：写死的 9 会在
      # pnpm install --frozen-lockfile 直接撞 ERR_PNPM_LOCKFILE_CONFIG_MISMATCH。
      - name: 解析 pnpm 版本
        id: pnpm
        run: |
          declared="$(node -p 'require("./upstream/package.json").packageManager ?? ""')"
          version="${declared#pnpm@}"
          if [[ -z "$version" || "$declared" == "$version" ]]; then
            echo "upstream/package.json 的 packageManager 不是 pnpm@…：'$declared'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "==> pnpm $version（来自 upstream/package.json 的 packageManager）"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 必须在 pnpm install 之前：补丁改的就是 apps/desktop 里要被安装/构建的东西。
      - name: 打补丁
        run: ./scripts/apply-patches.sh

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        working-directory: upstream

      # fpm 打 rpm 这一步要调 rpmbuild，Ubuntu runner 上不保证有。
      - name: 装 rpmbuild
        run: |
          if ! command -v rpmbuild >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends rpm
          fi

      # build.sh / verify.sh 刻意不读 DSH_HOME（DSH 会话会把它指向用户真实的 ~/.dsh），只认这个。
      - name: 隔离 dsh 数据目录
        run: echo "DSH_DESKTOP_LINUX_HOME=$RUNNER_TEMP/dsh-desktop-test" >> "$GITHUB_ENV"

      # --all = AppImage + deb + rpm，build.sh 内部会把 DSH_DESKTOP_TARGET_FORMATS 设成
      # "AppImage,deb,rpm"。deb/rpm 的 maintainer/homepage 只能来自 apps/desktop/.env.linux
      # （上游刻意忽略环境里的 DSH_DESKTOP_LINUX_*，见 desktop-package-environment.mjs 的
      # AMBIENT_RELEASE_SETTING），build.sh 首次运行会从 .env.linux.example 生成，里面带着
      # 本仓库的 maintainer 与上游 homepage。
      - name: 构建（AppImage + deb + rpm）
        run: ./scripts/build.sh --all

      - name: 验证
        run: ./scripts/verify.sh

      # 产物在 .desktop-build/ 下——这是个隐藏目录，而 upload-artifact 默认跳过隐藏文件，
      # 路径写对了也传不上去，必须显式打开 include-hidden-files。
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-desktop-linux-x64
          path: |
            upstream/apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
            upstream/apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.deb
            upstream/apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.rpm
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
