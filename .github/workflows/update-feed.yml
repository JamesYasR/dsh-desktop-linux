name: linux-update-feed

# 定时扫上游最新 tag，把 Linux AppImage 构建出来并发到一个滚动的 linux-latest release。
# 应用内「检查更新」读的就是这个 release 里的 nightly-linux.yml，所以这条流水线跑通一次，
# 之后上游发新版就会自动出现在用户的更新入口里。
#
# 幂等键 = 上游 ref + 补丁集指纹（patches/ PKGBUILD assets/ scripts/ 与 workflow 自身的 git 树哈希）。
# 只比 ref 是不够的：补丁修好之后 ref 没变，那样会永远跳过、修不进来。指纹记在 release 正文里。
#
# 手动触发可指定 ref（默认取上游最新的 dsh-v* tag）。推到 master 也会跑一次，
# 补丁改了但上游没发新版时，靠指纹判定需要重发。
#
# 版本号：同一上游版本的第 1 次发布与上游一致，第 2 次起带 <日期>.<序号>（上游 desktop-build-version.mjs
# 规定的形式，写错了打包前就会报错）。不这样做，补丁修复重发时版本号不变，而 electron-updater 用
# semver 比较 feed 版本与 app.getVersion()，已安装的用户会一直看到「已是最新」。序号记在 release 正文里。
#
# 发布历史：每次构建都会归档到 tag = 上游 ref 的 release（如 dsh-v0.2.1-alpha.3），那个 release 只追加、
# 不删除，所以任何历史版本都能直接下载回退；linux-latest 只作为应用内更新读的滚动 feed，只装当前版本。
# 补发旧版本时，在那个版本的补丁集所在的分支上手动触发（ref=当时的上游 tag、publish_feed=false），
# 这样只补归档、不动用户正在用的 feed。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '上游 ref（tag 或分支）；留空则取最新的 dsh-v* tag'
        required: false
        default: ''
      force:
        description: '即使该版本已发布，也重新构建'
        type: boolean
        default: false
      publish_feed:
        description: '是否更新滚动 feed（linux-latest）；留空=自动（仅当 ref 是最新 dsh-v* tag 时更新）'
        type: string
        default: ''
      build_number:
        description: '强制指定构建序号（补发历史版本时用）；留空=自动'
        type: string
        default: ''
  push:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  # 上游 CI 设这个，避免构建期跑到的 dsh 运行时往生产遥测端点上报。
  DSH_TELEMETRY_DISABLED: '1'
  # 滚动 tag：feed 地址必须是固定的，而上游版本号带 -rc/-alpha，走 releases/latest 会 404。
  RELEASE_TAG: linux-latest

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.upstream.outputs.ref }}
      fingerprint: ${{ steps.fingerprint.outputs.value }}
      build_number: ${{ steps.idempotency.outputs.build }}
      archive_tag: ${{ steps.idempotency.outputs.archive_tag }}
      publish_feed: ${{ steps.upstream.outputs.publish_feed }}
      skip: ${{ steps.idempotency.outputs.skip }}
    steps:
      - name: 解析上游 ref
        id: upstream
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_PUBLISH_FEED: ${{ github.event.inputs.publish_feed }}
        run: |
          # 最新 tag 既用于「不指定 ref」时的默认值，也用于判断要不要更新滚动 feed：
          # 补发历史版本时 ref 不是最新 tag，publish_feed 自动落成 0，只补归档。
          newest="$(git ls-remote --tags --refs https://github.com/deepseek-ai/deepseek-harness.git 'dsh-v*' \
            | awk -F/ '{print $NF}' | sort -V | tail -1)"
          ref="$INPUT_REF"
          [[ -n "$ref" ]] || ref="$newest"
          [[ -n "$ref" ]] || { echo "无法确定上游 ref" >&2; exit 1; }
          case "${INPUT_PUBLISH_FEED:-}" in
            true|1)  publish_feed=1 ;;
            false|0) publish_feed=0 ;;
            *)       [[ "$ref" == "$newest" ]] && publish_feed=1 || publish_feed=0 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "publish_feed=$publish_feed" >> "$GITHUB_OUTPUT"
          if (( publish_feed )); then feed_state='更新'; else feed_state='不动'; fi
          echo "==> 上游 ref：$ref（最新 tag：$newest；滚动 feed：$feed_state）"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # 决定「同样的上游版本要不要重发」的是补丁集，不是 ref：只要 patches/、PKGBUILD、assets/、
      # scripts/ 或本 workflow 变过，指纹就变。git ls-tree 直接取这些路径的 blob 哈希，比逐个
      # sha256 少依赖一层 shell 细节。README/文档改动不影响指纹，因此不会触发重编。
      - name: 计算补丁集指纹
        id: fingerprint
        run: |
          fingerprint="$(git ls-tree -r HEAD -- patches PKGBUILD assets scripts .github/workflows \
            | sha256sum | cut -c1-16)"
          [[ -n "$fingerprint" ]] || { echo "算不出补丁集指纹" >&2; exit 1; }
          echo "value=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "==> 补丁集指纹：$fingerprint"

      # 一次读两个 release，产出三件事：要不要跳过（幂等）、这是该上游版本的第几次构建、归档到哪个 tag。
      # 幂等键 = 上游 ref + 补丁集指纹；构建序号决定版本号后缀（见 build job 的构建步骤）。
      # - linux-latest：滚动 feed，正文里的 ref/指纹/序号是「当前 feed 是哪个版本的第几次构建」。
      # - 归档 release（tag = 上游 ref）：历史版本，正文同样记指纹与序号，补发时按它递增。
      - name: 幂等判断与构建序号
        id: idempotency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
          REF: ${{ steps.upstream.outputs.ref }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
          PUBLISH_FEED: ${{ steps.upstream.outputs.publish_feed }}
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          # release tag 不能带斜杠（ref 可能是分支名），所以归档 tag 用 ref 去掉斜杠。
          archive_tag="${REF//\//-}"
          echo "archive_tag=$archive_tag" >> "$GITHUB_OUTPUT"

          feed_ref="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name -q .name 2>/dev/null || true)"
          feed_body="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)"
          feed_fingerprint="$(printf '%s' "$feed_body" | sed -n 's/.*build-fingerprint: \([0-9a-f]\{8,\}\).*/\1/p' | head -1)"
          feed_build="$(printf '%s' "$feed_body" | sed -n 's/.*build-number: \([0-9]\{1,\}\).*/\1/p' | head -1)"

          archive_body="$(gh release view "$archive_tag" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)"
          archive_fingerprint="$(printf '%s' "$archive_body" | sed -n 's/.*build-fingerprint: \([0-9a-f]\{8,\}\).*/\1/p' | head -1)"
          archive_build="$(printf '%s' "$archive_body" | sed -n 's/.*build-number: \([0-9]\{1,\}\).*/\1/p' | head -1)"

          if [[ -n "$INPUT_BUILD_NUMBER" ]]; then
            # 补发历史版本时显式给序号，才能重现当时的版本号。
            build_number="$INPUT_BUILD_NUMBER"
          elif [[ "$feed_ref" == "$REF" ]]; then
            # feed 就是这个上游版本：再发就是补丁修复后的重发，序号 +1（两个 release 取大的那个，避免撞名）。
            base="${feed_build:-1}"
            [[ -n "$archive_build" && "$archive_build" -gt "$base" ]] && base="$archive_build"
            build_number="$(( base + 1 ))"
          elif [[ -n "$archive_build" ]]; then
            build_number="$(( archive_build + 1 ))"
          else
            build_number=1
          fi
          echo "build=$build_number" >> "$GITHUB_OUTPUT"

          skip=0
          if [[ "$FORCE" != "true" ]]; then
            if [[ "$PUBLISH_FEED" == "1" ]]; then
              [[ "$feed_ref" == "$REF" && "$feed_fingerprint" == "$FINGERPRINT" ]] && skip=1
            else
              # 只补归档：该归档 release 已经有同样指纹的构建就没必要重跑。
              [[ -n "$archive_body" && "$archive_fingerprint" == "$FINGERPRINT" ]] && skip=1
            fi
          fi
          if (( skip )); then
            echo "==> 跳过：目标已是最新（feed=${feed_ref:-无}@${feed_fingerprint:-无}，归档=${archive_tag}@${archive_fingerprint:-无}，本次指纹 $FINGERPRINT；要重跑请勾选 force）"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "==> 需要构建：feed=${feed_ref:-无}（第 ${feed_build:-0} 次）、归档=${archive_tag}（第 ${archive_build:-0} 次）→ 目标=$REF，本次第 $build_number 次$( (( PUBLISH_FEED )) && echo '，并更新 feed' || echo '，只归档不动 feed')"
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # 整条流水线要落 node_modules(~2.2G) + .desktop-build(~2.6G) + pnpm store(~2G)，
      # runner 上偏紧，先清掉镜像里用不到的大件。
      - name: 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 拉上游并打补丁
        run: |
          ./scripts/fetch-upstream.sh "${{ needs.prepare.outputs.ref }}"
          ./scripts/apply-patches.sh

      # 必须从上游检出里读 packageManager：本仓库根目录没有 package.json，
      # 而写死 pnpm 9 会在 pnpm install --frozen-lockfile 撞 ERR_PNPM_LOCKFILE_CONFIG_MISMATCH。
      - name: 解析 pnpm 版本
        id: pnpm
        run: |
          declared="$(node -p 'require("./upstream/package.json").packageManager ?? ""')"
          version="${declared#pnpm@}"
          [[ -n "$version" && "$declared" != "$version" ]] || { echo "packageManager 不是 pnpm@…：'$declared'" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        working-directory: upstream

      - name: 隔离 dsh 数据目录
        run: echo "DSH_DESKTOP_LINUX_HOME=$RUNNER_TEMP/dsh-desktop-test" >> "$GITHUB_ENV"

      # 上游刻意忽略环境里的 DSH_DESKTOP_LINUX_*，发布设置只能来自 apps/desktop/.env.linux。
      # feed 地址指向本仓库的滚动 release，产物因此自带这条更新通道；maintainer/homepage 进 deb 的
      # control 文件，模板里是上游移植者的名字，发布版必须写成本仓库。
      - name: 写入发布设置
        run: |
          env_file="upstream/apps/desktop/.env.linux"
          cp upstream/apps/desktop/.env.linux.example "$env_file"
          {
            echo
            echo "DSH_DESKTOP_LINUX_UPDATE_ORIGIN=https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
            echo "DSH_DESKTOP_LINUX_MAINTAINER=\"${GITHUB_REPOSITORY_OWNER} <${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com>\""
            echo "DSH_DESKTOP_LINUX_HOMEPAGE=https://github.com/$GITHUB_REPOSITORY"
          } >> "$env_file"
          grep -v '^#' "$env_file" | grep -v '^$'

      # AppImage 与 deb 必须**一次**构建：更新元数据只由最后一次 electron-builder 调用生成，
      # 分两次跑后一次会覆盖前一次，AppImage 的更新通道就没了（AppImageUpdater 靠元数据里的
      # files 列表按扩展名挑包，所以两个都在同一份元数据里反而正确）。
      #
      # 同一上游版本被重发时（补丁修好后再发）版本号必须递增：electron-updater 用 semver.gt 比较
      # feed 版本与 app.getVersion()，版本号不变就等于「已是最新」，已安装的用户永远收不到这次修复。
      # 形式沿用上游 desktop-build-version.mjs 的规定 <product version>.<date>.<index>（由上游自己校验，
      # 写错了会在打包前就报错）：第 1 次发布与上游版本一致，第 2 次起带 <日期>.<序号>。
      - name: 构建（AppImage + deb）
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          product_version="$(node -p 'require("./upstream/apps/desktop/package.json").version')"
          if (( BUILD_NUMBER > 1 )); then
            version="${product_version}.$(date -u +%Y%m%d).${BUILD_NUMBER}"
          else
            version="$product_version"
          fi
          export DSH_DESKTOP_BUILD_VERSION="$version"
          # 后面的校验与发布步骤也要读它（GITHUB_ENV 只对之后的步骤生效）。
          echo "DSH_DESKTOP_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "==> 本次发布版本：$version（上游 $product_version 的第 $BUILD_NUMBER 次构建）"
          ./scripts/build.sh --formats=AppImage,deb

      # 通道名固定为 nightly（update-coordinator.ts），所以元数据是 nightly-linux.yml，
      # 不是 electron-builder 默认的 latest-linux.yml。名字不对应用就查不到更新。
      - name: 校验产物
        id: artifacts
        run: |
          dir="upstream/apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts"
          metadata="$dir/nightly-linux.yml"
          appimage="$(find "$dir" -maxdepth 1 -name '*.AppImage' -print -quit)"
          deb="$(find "$dir" -maxdepth 1 -name '*.deb' -print -quit)"
          [[ -f "$metadata" ]] || { echo "缺少 $metadata" >&2; ls -la "$dir" >&2; exit 1; }
          [[ -n "$appimage" ]] || { echo "缺少 .AppImage" >&2; exit 1; }
          [[ -n "$deb" ]] || { echo "缺少 .deb" >&2; exit 1; }
          grep -q '^sha512:' "$metadata" || { echo "$metadata 里没有 sha512" >&2; exit 1; }
          grep -q "$(basename "$appimage")" "$metadata" || { echo "$metadata 没有列出 AppImage" >&2; exit 1; }
          grep -q "$(basename "$deb")" "$metadata" || { echo "$metadata 没有列出 deb" >&2; exit 1; }
          # 版本号是这一轮新加的输入：元数据里的版本必须与构建时给的一致，否则更新通道会发出错误版本号。
          metadata_version="$(sed -n 's/^version: //p' "$metadata" | head -1)"
          [[ "$metadata_version" == "$DSH_DESKTOP_BUILD_VERSION" ]] \
            || { echo "元数据版本 $metadata_version 与构建版本 $DSH_DESKTOP_BUILD_VERSION 不一致" >&2; exit 1; }
          {
            echo "metadata=$metadata"
            echo "appimage=$appimage"
            echo "deb=$deb"
          } >> "$GITHUB_OUTPUT"
          echo "==> $metadata"
          cat "$metadata"
          echo "==> deb control"
          dpkg-deb -f "$deb" Package Version Maintainer Architecture

      # 「回滚到旧版本」要判断旧版本能不能读当前的数据，所以目录里的每一条都得带上会话/查询/存储
      # 三个格式版本。它们只在源码里定义，构建期直接从上游检出读，避免手抄漂移；读不到就直接失败 ——
      # 目录里绝不能出现格式版本缺失的条目。
      - name: 提取格式版本
        id: schemas
        run: |
          read_const() {
            local file="$1" name="$2" value
            value="$(grep -oE "${name} = [0-9]+" "$file" | grep -oE '[0-9]+' | head -1)"
            [[ -n "$value" ]] || { echo "在 $file 里找不到 $name" >&2; exit 1; }
            printf '%s' "$value"
          }
          session_format="$(read_const upstream/packages/core/session/src/types.ts SESSION_FORMAT_VERSION)"
          session_query="$(read_const upstream/packages/session-query/session-query-sqlite/src/schema.ts SESSION_QUERY_SQLITE_SCHEMA_VERSION)"
          storage_schema="$(read_const upstream/packages/storage/storage-sqlite/src/schema.ts STORAGE_SQLITE_SCHEMA_VERSION)"
          {
            echo "session_format=$session_format"
            echo "session_query=$session_query"
            echo "storage_schema=$storage_schema"
          } >> "$GITHUB_OUTPUT"
          echo "==> 格式版本：session=$session_format、session-query=$session_query、storage=$storage_schema"

      # 两处发布，职责分开：
      # - 归档 release（tag = 上游 ref，如 dsh-v0.2.1-alpha.3）：只追加、不删除，是**回退**用的历史版本；
      #   同一个上游版本重发（补丁修复）时新产物文件名带 <日期>.<序号>，旧的继续留着。
      # - 滚动 release（linux-latest）：应用内更新读的 feed（nightly-linux.yml + 当前版本的产物），
      #   只装当前版本，所以这里仍然清掉上一版遗留的资产。清理只匹配 AppImage/deb/rpm/更新元数据，
      #   versions.json 不在其中，不会被误删（下一轮也是先清后传，顺序上更安全）。
      # publish_feed=0 时只写归档 release，用户正在用的 feed 一动不动（补发历史版本就是这个场景）。
      - name: 发布（历史归档 + 滚动 feed）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_FEED: ${{ needs.prepare.outputs.publish_feed }}
          ARCHIVE_TAG: ${{ needs.prepare.outputs.archive_tag }}
          SESSION_FORMAT: ${{ steps.schemas.outputs.session_format }}
          SESSION_QUERY_SCHEMA: ${{ steps.schemas.outputs.session_query }}
          STORAGE_SCHEMA: ${{ steps.schemas.outputs.storage_schema }}
        run: |
          set -euo pipefail
          ref="${{ needs.prepare.outputs.ref }}"
          fingerprint="${{ needs.prepare.outputs.fingerprint }}"
          build_number="${{ needs.prepare.outputs.build_number }}"
          version="$DSH_DESKTOP_BUILD_VERSION"
          metadata="${{ steps.artifacts.outputs.metadata }}"
          appimage="${{ steps.artifacts.outputs.appimage }}"
          deb="${{ steps.artifacts.outputs.deb }}"

          # 目录字段的来源：产物文件名、sha512（base64，与 feed 元数据同一套算法）与字节数。
          appimage_name="$(basename "$appimage")"
          appimage_sha512="$(openssl dgst -sha512 -binary "$appimage" | base64 -w0)"
          appimage_size="$(stat -c%s "$appimage")"
          deb_name="$(basename "$deb")"
          deb_sha512="$(openssl dgst -sha512 -binary "$deb" | base64 -w0)"
          deb_size="$(stat -c%s "$deb")"

          # 正文带上补丁集指纹、构建序号与来源（HTML 注释，界面上看不见）；prepare 的幂等判断与
          # 序号递增读 build-fingerprint / build-number，source-commit 说明这份产物是哪次提交的
          # 补丁集构建出来的（回退时用得上）。其余注释是给 versions.json 目录读的：格式版本用于
          # 判断旧版本能不能读当前数据，产物文件名/sha512/size 用于直接下载并校验。
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n\n<!-- build-version: %s -->\n<!-- build-fingerprint: %s -->\n<!-- build-number: %s -->\n<!-- upstream-ref: %s -->\n<!-- source-commit: %s -->\n<!-- session-format: %s -->\n<!-- session-query-schema: %s -->\n<!-- storage-schema: %s -->\n<!-- appimage: %s -->\n<!-- appimage-sha512: %s -->\n<!-- appimage-size: %s -->\n<!-- deb: %s -->\n<!-- deb-sha512: %s -->\n<!-- deb-size: %s -->\n' \
            "DeepSeek Harness desktop for Linux，版本 $version（上游 $ref 的第 $build_number 次构建，unsigned）。AppImage 支持应用内自更新（feed 在 $RELEASE_TAG release 的 nightly-linux.yml）；deb 用 apt 安装、手动升级。本 release 是上游 $ref 的历史归档，只追加不删除，可直接下载回退。" \
            "$version" "$fingerprint" "$build_number" "$ref" "$GITHUB_SHA" \
            "$SESSION_FORMAT" "$SESSION_QUERY_SCHEMA" "$STORAGE_SCHEMA" \
            "$appimage_name" "$appimage_sha512" "$appimage_size" \
            "$deb_name" "$deb_sha512" "$deb_size" > "$notes"

          if (( ! PUBLISH_FEED )); then
            echo "==> 本次只写归档 release $ARCHIVE_TAG，不动 $RELEASE_TAG"
          fi

          # 归档 release：只覆盖同名文件，不删任何历史产物（重发时新文件名带日期序号，旧的自然留下）。
          if ! gh release view "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" --title "$ref" \
              --target "$GITHUB_SHA" --notes-file "$notes"
          fi
          gh release upload "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$metadata" "$appimage" "$deb"
          gh release edit "$ARCHIVE_TAG" --repo "$GITHUB_REPOSITORY" --title "$ref" --notes-file "$notes"
          echo "==> 归档：https://github.com/$GITHUB_REPOSITORY/releases/tag/$ARCHIVE_TAG"

          if (( PUBLISH_FEED )); then
            tag="$RELEASE_TAG"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$ref" --notes-file "$notes"
            fi
            # 先上传新载荷并覆盖同名项，再清掉上一版遗留的资产，缩短 feed 不完整的窗口。
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$metadata" "$appimage" "$deb"
            while read -r name; do
              case "$name" in
                *.AppImage|*.deb|*.rpm|*-linux.yml)
                  [[ "$name" == "$(basename "$metadata")" || "$name" == "$(basename "$appimage")" || "$name" == "$(basename "$deb")" ]] && continue
                  gh release delete-asset "$tag" "$name" --repo "$GITHUB_REPOSITORY" --yes
                  ;;
              esac
            done < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            # 标题记来源 ref、正文记补丁集指纹；prepare 用这两个一起判断是否需要重新构建。
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$ref" --notes-file "$notes"
            echo "==> feed: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"

            # 历史版本目录：客户端从 <origin>/versions.json 读所有可回退的版本，而 origin 就是滚动
            # release 的下载前缀，所以目录必须挂到同一个 release 上，与 feed 同源同时更新。
            # 只归档的运行（publish_feed=0）在这一步之外，绝不改滚动 release，避免目录里混进
            # 没进 feed 的版本、或漏掉正在生效的版本。
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp \
              | node scripts/versions-index.mjs > "$RUNNER_TEMP/versions.json"
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/versions.json"
            versions_count="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).versions.length' "$RUNNER_TEMP/versions.json")"
            versions_current="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).current' "$RUNNER_TEMP/versions.json")"
            echo "==> 版本目录：https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/versions.json（共 $versions_count 条，current=$versions_current）"
          fi
